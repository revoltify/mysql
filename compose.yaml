x-node: &node
  image: ghcr.io/revoltify/mysql:latest
  network_mode: host
  restart: unless-stopped
  env_file: .env
  logging:
    driver: json-file
    options:
      max-size: 50m
      max-file: "5"

services:
  mysql:
    <<: *node
    volumes:
      - ./data:/var/lib/mysql
      - ./.env:/etc/node.env:ro
      - ./backup:/var/lib/mysql-backup
    stop_grace_period: 120s
    ulimits:
      nofile: 65535

  router:
    <<: *node
    entrypoint: [/usr/local/bin/tini, --, router]
    volumes:
      - ./router:/router
      - ./.env:/etc/node.env:ro
      - ./tls:/tls:ro
      - ./acme:/acme
    ulimits:
      nofile: 65535
    healthcheck:
      disable: true
